name: CI/CD Pipeline & PyPI Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # Mandatory for PyPI Trusted Publisher (OIDC) authentication

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install Dependencies
        run: |
          uv sync --extra dev

      - name: Run Pytest Test Suite
        run: |
          uv run pytest -v

  build-and-publish:
    name: Build & Publish to PyPI
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build Package (sdist and wheel)
        run: |
          python -m build

      - name: Check Package Artifacts
        run: |
          twine check dist/*

      - name: Publish Package to PyPI (OIDC / Token)
        id: publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://upload.pypi.org/legacy/
          # Uses PyPI Trusted Publishing (OIDC) automatically when configured on PyPI.
          # Or falls back to PYPI_API_TOKEN secret in GitHub Repository Settings.
          password: ${{ secrets.PYPI_API_TOKEN }}
        continue-on-error: true

      - name: Fallback PyPI Token Publish
        if: steps.publish.outcome == 'failure'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          twine upload dist/* --skip-existing
